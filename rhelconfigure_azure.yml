---
- name: Register RHEL VMs and install Insights/related
  hosts: azure
  gather_facts: false
  become: true

  tasks:
    - name: Set the system hostname correctly
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
        use: systemd
      tags:
        - hostname

    - name: Install some useful packages
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop:
        - bash-completion
        - vim
        - tmux
        - rhc
        - rhc-worker-playbook

    - name: Install Insights-related packages
      ansible.builtin.yum:
        name: "{{ item }}"
        state: present
      loop:
        - insights-client
        - scap-security-guide
        - openscap-scanner
      tags:
        - insights
