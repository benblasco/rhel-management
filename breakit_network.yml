---
- name: Add quotes to device name
  hosts: all
  become: true

  tasks:
    - name: Get files in the path
      ansible.builtin.command:
        cmd: ls /etc/sysconfig/network-scripts/ifcfg-*
      register: path_files
      changed_when: false

    - name: Add quotes around device names
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: '(^\s*DEVICE=)(.*)'
        line: '\1"\2"'
        backup: true
        backrefs: true
      loop: "{{ path_files.stdout_lines }}"
